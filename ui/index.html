<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FinOKF Vault</title>
    <link rel="stylesheet" href="./vendor/ag-grid/ag-grid.css" />
    <link rel="stylesheet" href="./vendor/ag-grid/ag-theme-quartz.css" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="workspace">
      <section class="main-panel" aria-label="Graph and markdown viewer">
        <nav class="view-rail" aria-label="Viewer switcher">
          <button id="graphViewButton" class="view-button active" type="button" data-view="graph" aria-label="Show graph" title="Graph view">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="6" cy="7" r="2.5"></circle>
              <circle cx="17" cy="5" r="2.5"></circle>
              <circle cx="18" cy="17" r="2.5"></circle>
              <circle cx="7" cy="18" r="2.5"></circle>
              <path d="M8.4 6.4 14.6 5.5M7.3 9.1 16.4 15.4M15.6 17.2 9.4 17.8"></path>
            </svg>
          </button>
          <button id="markdownViewButton" class="view-button" type="button" data-view="markdown" aria-label="Show markdown" title="Markdown view">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M6 3.5h8l4 4V20.5H6z"></path>
              <path d="M14 3.5V8h4"></path>
              <path d="M8.5 12h7M8.5 15h7M8.5 18h4"></path>
            </svg>
          </button>
          <button id="providerButton" class="view-button provider-toggle" type="button" aria-label="Connect model provider" aria-expanded="false" title="Model connection">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M15 7.5a4 4 0 1 1-3.4 6.1L8 17.2H5v-3h2.2l2.2-2.2A4 4 0 0 1 15 7.5z"></path>
              <path d="M16.5 9.5h.01"></path>
            </svg>
          </button>
          <section id="providerPanel" class="provider-panel" hidden aria-label="Model provider connection">
            <div class="provider-panel-title">Model connection</div>
            <div class="provider-choice-grid" role="group" aria-label="Choose model provider">
              <button class="provider-choice" type="button" data-provider="openai">ChatGPT</button>
              <button class="provider-choice" type="button" data-provider="anthropic">Anthropic</button>
              <button class="provider-choice" type="button" data-provider="ollama">Local LLM</button>
            </div>
            <div class="provider-note">API keys are sent only with the current request and are not stored by FinOKF.</div>
            <div class="provider-fields" data-provider-fields="openai" hidden>
              <label>
                <span>OpenAI API key</span>
                <input id="openaiApiKey" type="password" autocomplete="off" spellcheck="false" placeholder="sk-…" />
              </label>
              <label>
                <span>Model</span>
                <input id="openaiModel" type="text" autocomplete="off" spellcheck="false" value="gpt-5-mini" />
              </label>
            </div>
            <div class="provider-fields" data-provider-fields="anthropic" hidden>
              <label>
                <span>Anthropic API key</span>
                <input id="anthropicApiKey" type="password" autocomplete="off" spellcheck="false" placeholder="sk-ant-…" />
              </label>
              <label>
                <span>Model</span>
                <input id="anthropicModel" type="text" autocomplete="off" spellcheck="false" value="claude-sonnet-5" />
              </label>
            </div>
            <div class="provider-fields" data-provider-fields="ollama" hidden>
              <label>
                <span>Ollama URL</span>
                <input id="ollamaUrl" type="url" autocomplete="off" spellcheck="false" value="http://127.0.0.1:11434" />
              </label>
              <label>
                <span>Model</span>
                <input id="ollamaModel" type="text" autocomplete="off" spellcheck="false" value="llama3.2:3b" />
              </label>
            </div>
            <button id="providerChangeButton" class="provider-change" type="button" disabled>Change provider</button>
          </section>
        </nav>

        <div class="view-stack">
          <section id="graphView" class="viewer graph-view active" aria-label="Directional graph">
            <canvas id="graphCanvas" aria-label="Animated directional graph"></canvas>

            <div class="graph-search">
              <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6"></circle><path d="M20 20l-3.5-3.5"></path></svg>
              <input id="graphSearch" type="text" autocomplete="off" spellcheck="false" placeholder="Search notes…" />
              <div id="searchResults" class="search-results" role="listbox"></div>
            </div>

            <div class="graph-controls" role="group" aria-label="Graph controls">
              <button data-zoom="in" type="button" title="Zoom in" aria-label="Zoom in">+</button>
              <button data-zoom="out" type="button" title="Zoom out" aria-label="Zoom out">−</button>
              <button data-zoom="reset" type="button" title="Fit graph" aria-label="Fit graph">⤢</button>
              <button data-graph="home" type="button" title="Overview" aria-label="Overview">⌂</button>
            </div>

            <div id="graphStatus" class="graph-status"></div>
            <div class="graph-legend" id="graphLegend" aria-hidden="true"></div>
          </section>

          <section id="markdownView" class="viewer markdown-view" aria-label="Markdown reader">
            <header class="doc-titlebar">
              <div class="doc-title" id="docTitle" title="">Select a note</div>
              <div class="doc-actions">
                <span id="saveState" class="save-state"></span>
                <button id="editToggle" class="doc-btn" type="button" title="Toggle edit mode">Edit</button>
                <button id="saveButton" class="doc-btn primary" type="button" title="Save (⌘/Ctrl+S)" disabled>Save</button>
              </div>
            </header>
            <div class="doc-body">
              <article id="docRendered" class="markdown-rendered">Loading…</article>
              <textarea id="docEditor" class="markdown-editor" spellcheck="false" hidden></textarea>
            </div>
          </section>
        </div>
      </section>

      <aside class="chat-panel" aria-label="Research chat">
        <div class="chat-head">
          <div class="chat-head-copy">
            <div class="chat-head-title">Research assistant</div>
            <div class="active-vault-label">Local clearbox cache</div>
          </div>
          <div class="chat-head-actions">
            <select id="methodSelect" class="method-select" aria-label="Answer method" title="Answer method">
              <option value="auto">Automatic</option>
              <option value="naive">Naïve LLM</option>
            </select>
            <button id="newChatButton" class="chat-head-btn" type="button" aria-label="Start new chat" title="New chat">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 5v14M5 12h14"></path>
              </svg>
            </button>
          </div>
        </div>
        <section id="vaultInspector" class="vault-inspector" hidden aria-label="Clearbox cache vault">
          <div class="vault-inspector-head">
            <div>
              <div class="vault-kicker">Clearbox cache vault</div>
              <div id="vaultTitle" class="vault-title">No answer cached yet</div>
            </div>
            <div id="vaultSkill" class="vault-skill"></div>
          </div>
          <div id="vaultChain" class="vault-chain"></div>
          <div id="vaultMetrics" class="vault-metrics"></div>
        </section>
        <div id="chatMessages" class="chat-messages"></div>
        <form id="chatForm" class="chat-form">
          <input id="chatInput" type="text" autocomplete="off" placeholder="Ask about the selected note" />
          <button type="submit">Ask</button>
        </form>
        <div class="vault-switcher-dock">
          <button id="historyButton" class="vault-switcher-button" type="button" aria-label="Switch vault" aria-expanded="false">
            <span class="vault-switcher-chevrons" aria-hidden="true">⌃<br />⌄</span>
            <span id="activeVaultLabel" class="vault-switcher-name">Knowledge graph</span>
            <span class="vault-switcher-gear" aria-hidden="true">⚙</span>
          </button>
          <section id="vaultHistoryPanel" class="vault-history-panel" hidden aria-label="Vault switcher">
            <div class="vault-history-title">Vaults</div>
            <div id="vaultHistoryList" class="vault-history-list"></div>
            <div class="vault-history-manage">Manage vaults…</div>
          </section>
        </div>
      </aside>
    </main>
    <script src="./vendor/ag-grid/ag-grid-community.min.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
